name: "release/assets"

on:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: "${{ matrix.task }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: release-assets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup runner
        uses: webdevops/setup-runner@f4eba686061111a15ec99436f2b94bccf3e6a45a # main

      - name: Setup go
        uses: webdevops/setup-go@7f772fd23d0887f433acac765f732b9c28c5a24c # main

      - name: Build
        run: |
          make "${{ matrix.task }}"

      - name: Upload assets to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release-assets/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          promote: false
